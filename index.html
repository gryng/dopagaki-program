<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="海の上を飛びながら、AIアシスタントと記憶を思い出すチルなトレーニングゲーム。">
<title>ドパガキ老化防止プログラム</title>
<style>
  /* Layout: full-bleed canvas, one faint hint, nothing else */
  :root {
    --ink: #f4efe6;
    --ink-dim: rgba(244, 239, 230, 0.6);
    --night: #0b1020;
    --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    overflow: hidden;
    font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
  }
  canvas#sky {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; touch-action: none; cursor: grab;
  }
  canvas#sky:active { cursor: grabbing; }
  .msg {
    position: fixed; left: 0; right: 0;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 15px; letter-spacing: 0.12em;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
    pointer-events: none; transition: opacity 2.4s ease;
    padding-inline: 16px;
  }
  .msg small { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.08em; }
  .msg.gone { opacity: 0; }
  .ver {
    position: fixed;
    left: calc(12px + env(safe-area-inset-left, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    font-size: 10px; color: var(--ink-dim); opacity: 0.6;
    pointer-events: none; letter-spacing: 0.1em;
  }
  .clock {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: 0; right: 0; text-align: center;
    font-size: 22px; letter-spacing: 0.18em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
    pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
  }
  .clock.on { opacity: 0.9; }
  /* pomodoro: a small glass pill in the top-left corner */
  .pomo {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 5;
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 16px 0 8px; border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 24, 36, 0.32);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .pomo:focus-visible { outline: 2px solid rgba(255, 236, 200, 0.85); outline-offset: 2px; }
  .pomo svg { width: 28px; height: 28px; transform: rotate(-90deg); }
  .pomo .track { stroke: rgba(255, 255, 255, 0.18); }
  .pomo .bar { stroke: #f3d9a8; transition: stroke 0.6s ease; }
  .pomo.break .bar { stroke: #9fe0cf; }
  .pomo.paused { opacity: 0.6; }
  .pomo-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
  .pomo-time { font-size: 17px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .pomo-label { font-size: 10px; letter-spacing: 0.14em; color: var(--ink-dim); }
  .pomo-dots { display: flex; gap: 4px; margin-left: 2px; }
  .pomo-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, 0.22); }
  .pomo-dots i.done { background: #f3d9a8; }
  .toast {
    position: fixed; left: 0; right: 0;
    top: calc(40% + env(safe-area-inset-top, 0px));
    text-align: center; font-size: 20px; letter-spacing: 0.16em;
    text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
    pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
    padding-inline: 16px;
  }
  .toast small { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-dim); letter-spacing: 0.1em; }
  .toast.on { opacity: 1; }
  /* the fairy's words: soft glowing text floating just above it */
  .speech {
    position: fixed; left: 0; top: 0; z-index: 3;
    max-width: min(78vw, 22em);
    font-size: 15px; line-height: 1.7; letter-spacing: 0.08em;
    text-align: center; text-wrap: balance;
    color: #fff8ec;
    text-shadow: 0 0 10px rgba(255, 214, 150, 0.55), 0 1px 14px rgba(0, 0, 0, 0.5);
    pointer-events: none; opacity: 0;
    transition: opacity 1.6s ease;
    will-change: transform, opacity;
  }
  .speech.on { opacity: 1; transition: opacity 0.25s ease; }
  /* words being "decoded": scrambled glyphs in a cool tint that settle into
     the real character and warm up; a small block cursor rides the front */
  .speech .ch { position: relative; transition: color 0.5s ease, text-shadow 0.5s ease; }
  .speech .ch.wait { visibility: hidden; }
  .speech .ch.scr {
    color: #a8ecff;
    text-shadow: 0 0 8px rgba(120, 220, 255, 0.85), 0 1px 14px rgba(0, 0, 0, 0.5);
    transition: none;
  }
  .speech .ch.cur::after {
    content: ''; position: absolute; left: 100%; top: 0.28em; bottom: 0.22em; width: 0.42em; margin-left: 0.08em;
    background: rgba(168, 236, 255, 0.85); box-shadow: 0 0 8px rgba(120, 220, 255, 0.9);
  }
  .speech .ch.idle::after {
    content: ''; position: absolute; left: 100%; top: 0.28em; bottom: 0.22em; width: 0.42em; margin-left: 0.08em;
    background: rgba(168, 236, 255, 0.7); animation: blink 1s steps(1) 2 forwards;
  }
  @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } 100% { opacity: 0 } }
  .speech small { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 0.14em; color: rgba(255, 248, 236, 0.7); }
  @media (min-width: 700px) { .speech { font-size: 17px; } }
  /* LINE's in-app browser: a glass card asking to reopen in Safari / Chrome */
  .inapp {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(8, 10, 18, 0.45);
  }
  .inapp[hidden] { display: none; }
  [hidden] { display: none !important; }
  .inapp-card {
    max-width: 22em; padding: 26px 22px 18px; border-radius: 20px;
    display: flex; flex-direction: column; gap: 14px; text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(18, 22, 34, 0.62);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  }
  .inapp-card h2 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 0.1em; text-wrap: balance; }
  .inapp-card p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--ink-dim); letter-spacing: 0.04em; }
  .inapp-open {
    height: 50px; border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-size: 16px; letter-spacing: 0.12em;
    color: #1d1a14; background: #f3d9a8;
  }
  .inapp-stay { border: 0; background: none; color: var(--ink-dim); font: inherit; font-size: 13px; padding: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .inapp-open:focus-visible, .inapp-stay:focus-visible { outline: 2px solid rgba(255, 236, 200, 0.85); outline-offset: 2px; }
  /* menu: a small glass button in the top-right corner, opening a list of times */
  .menu {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    z-index: 5;
  }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 24, 36, 0.32);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--ink); cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .menu-btn:hover { background: rgba(20, 24, 36, 0.48); }
  .menu-btn:focus-visible, .time-opt:focus-visible { outline: 2px solid rgba(255, 236, 200, 0.85); outline-offset: 2px; }
  .menu-btn svg { width: 22px; height: 22px; }
  .panel {
    min-width: 190px;
    padding: 8px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(18, 22, 34, 0.5);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    display: flex; flex-direction: column; gap: 2px;
    transform-origin: top right;
    animation: pop 0.18s ease;
    /* the list got long: scroll inside the panel on short screens */
    max-height: calc(100vh - 90px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } }
  /* music: its own button just left of the menu button */
  .music {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(68px + env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    z-index: 5;
  }
  .music .panel { min-width: 230px; }
  .time-opt.locked { cursor: default; opacity: 0.5; box-sizing: border-box; }
  .time-opt.locked:hover { background: none; }
  .time-opt .lock { display: grid; place-items: center; }
  .music-note { margin: 6px 10px 4px; font-size: 11px; line-height: 1.6; color: var(--ink-dim); letter-spacing: 0.04em; }
  .unlock-kicker { font-size: 11px !important; letter-spacing: 0.3em !important; color: #f3d9a8 !important; }
  .unlock-songs { font-size: 16px !important; color: var(--ink) !important; line-height: 1.9 !important; }
  .panel h2 {
    margin: 4px 10px 6px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.16em; color: var(--ink-dim);
  }
  .time-opt {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: transparent; color: var(--ink); cursor: pointer;
    font: inherit; font-size: 15px; letter-spacing: 0.08em; text-align: left;
  }
  .time-opt span { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .time-opt:hover { background: rgba(255, 255, 255, 0.08); }
  .time-opt[aria-current="true"] { background: rgba(255, 236, 200, 0.14); }
  .check-opt input { width: 18px; height: 18px; margin: 0; accent-color: #f3d9a8; flex: none; }
  .check-opt { cursor: pointer; align-items: center; box-sizing: border-box; }
  .panel hr { border: 0; height: 1px; margin: 6px 8px; background: rgba(255, 255, 255, 0.12); }
  .time-opt small { display: block; margin-top: 2px; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) { .msg, .clock { transition: none; } .panel { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500&display=swap">

<canvas id="sky"></canvas>
<div class="msg" id="msg">空を計算しています…</div>
<div class="clock" id="clock" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>
<div class="speech" id="speech" aria-live="polite"></div>
<div class="inapp" id="inapp" hidden>
  <section class="inapp-card" role="dialog" aria-modal="true" aria-labelledby="inappH">
    <h2 id="inappH">Safariで開いてください</h2>
    <p>LINEの中のブラウザだと、空や海がうまく描けないことがあります。SafariやChromeで開くと、きれいに遊べます。</p>
    <button class="inapp-open" id="inappOpen" type="button">Safariで開く</button>
    <button class="inapp-stay" id="inappStay" type="button">このまま遊ぶ</button>
  </section>
</div>
<div class="inapp" id="soundAsk" hidden>
  <section class="inapp-card" role="dialog" aria-modal="true" aria-labelledby="soundAskH">
    <h2 id="soundAskH">音を出しますか？</h2>
    <p>静かな音楽と、小さな効果音が流れます。あとからメニューで変えられます。</p>
    <button class="inapp-open" id="soundOn" type="button">音を出す</button>
    <button class="inapp-stay" id="soundOff" type="button">音なしで遊ぶ</button>
  </section>
</div>
<button class="pomo" id="pomo" type="button" hidden aria-label="ポモドーロタイマー（タップで一時停止・再開）">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="track" cx="18" cy="18" r="15" fill="none" stroke-width="3"/>
    <circle class="bar" id="pomoBar" cx="18" cy="18" r="15" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0"/>
  </svg>
  <span class="pomo-text"><span class="pomo-time" id="pomoTime">25:00</span><span class="pomo-label" id="pomoLabel">集中</span></span>
  <span class="pomo-dots" id="pomoDots"><i></i><i></i><i></i><i></i></span>
</button>
<nav class="menu" id="menu" hidden>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>
    </svg>
  </button>
  <div class="panel" id="panel" hidden>
    <h2 id="timeTitle">時間帯</h2>
  </div>
</nav>
<nav class="music" id="music" hidden>
  <button class="menu-btn" id="musicBtn" type="button" aria-label="BGMをえらぶ" aria-expanded="false" aria-controls="musicPanel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 17.5V6.2l10-2.1v11.3"/><circle cx="6.6" cy="17.5" r="2.4"/><circle cx="16.6" cy="15.4" r="2.4"/>
    </svg>
  </button>
  <div class="panel" id="musicPanel" hidden></div>
</nav>
<div class="inapp" id="unlock" hidden>
  <section class="inapp-card" role="dialog" aria-modal="true" aria-labelledby="unlockH">
    <p class="unlock-kicker">NEW MUSIC</p>
    <h2 id="unlockH"></h2>
    <p class="unlock-songs" id="unlockSongs"></p>
    <p id="unlockP"></p>
    <button class="inapp-open" id="unlockOk" type="button">OK</button>
  </section>
</div>
<div class="ver">v1.02</div>

<script type="module">
  // LINE's in-app browser: offer to reopen in the phone's own browser
  // (LINE opens a link in the default browser when it has openExternalBrowser=1)
  if ((/\bLine\//i.test(navigator.userAgent) || location.hash === '#inapptest') && !/[?&]openExternalBrowser=1/.test(location.search)) {
    const box = document.getElementById('inapp')
    box.hidden = false
    box.addEventListener('pointerdown', e => e.stopPropagation())
    document.getElementById('inappOpen').addEventListener('click', () => {
      const u = new URL(location.href)
      u.searchParams.set('openExternalBrowser', '1')
      location.href = u.toString()
    })
    document.getElementById('inappStay').addEventListener('click', () => { box.hidden = true })
  }
  const msg = document.getElementById('msg')
  const clock = document.getElementById('clock')
  const menu = document.getElementById('menu')
  const btn = document.getElementById('menuBtn')
  const panel = document.getElementById('panel')
  let hinted = false, clockTimer = 0
  const hasKeys = matchMedia('(hover: hover) and (pointer: fine)').matches
  const fmt = h => Math.floor(h) + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0')

  function onEvent(state, value) {
    if (state === 'ready') {
      msg.innerHTML = hasKeys
        ? 'ドラッグか矢印キーで、かたむける<small>Space で加速　Q / E で時間を戻す・進める</small>'
        : 'ドラッグで、かたむける<small>2本指で加速　下を向くと速くなります</small>'
      if (hinted) msg.classList.add('gone')
    } else if (state === 'time') {
      clock.textContent = fmt(value)
      clock.classList.add('on')
      clearTimeout(clockTimer)
      clockTimer = setTimeout(() => clock.classList.remove('on'), 1500)
    } else if (state === 'input' && !hinted) {
      hinted = true
      setTimeout(() => msg.classList.add('gone'), 1200)
    }
  }

  // high quality (simulated waves): off by default, remembered per browser
  let hq = false
  try { hq = localStorage.getItem('sora-hq') === 'on' } catch (_) {}
  if (location.hash === '#hq') hq = true

  let start, api, opts = [], q, pomoItem

  // ---------------- the fairy talks ----------------
  // Lines drift by on their own at a slow pace; nothing to tap.
  // The fairy is the "ドパガキ老化防止プログラム": it rescues people stuck on
  // short videos with chill time and memory training. It speaks like a polite
  // AI assistant: 私 / あなた, です・ます.
  const INTRO = [
    'こんにちは。',
    '「ドパガキ老化防止プログラム」へようこそ。',
    '私は未来から来ました。',
    '未来では人類のドパガキ化が進み、人類は滅びました。',
    '人類の滅亡を防ぐために、一緒にトレーニングしましょう。',
    'まずは、ショート動画から少し離れましょう。私がサポートします。',
    'なお、セリフ送りのボタンはありません。',
    'このプログラムは、のんびり過ごすことを目的としています。',
    '記憶を思い出すことは、脳の老化防止に役立つとされています。',
    'これから、最近のことと少し昔のことを、一緒に思い出していきましょう。',
    '所要時間は5分から10分程度です。',
    'それでは、プログラムを開始します。',
    '質問が表示されたら、思い出せたタイミングで私をタップしてください。'
  ]
  // Q(...) lines are questions: they stay until you tap the fairy.
  // GO(...) moves the sky to the next time of day (and turns you toward it).
  const Q = t => ({ t, q: true })
  const QC = t => ({ t, q: true, ctx: true }) // only makes sense right after the line before it
  const GO = id => ({ go: id })
  // Five questions per chapter; each chapter has its own time of day and theme.
  const CHAPTERS = [
    { // 昼: the last few days
      lines: [
        Q('一昨日の夕食は何でしたか？'),
        '思い出せなくても問題ありません。ゆっくりで大丈夫です。',
        Q('最近、声を出して笑ったのはいつですか？'),
        QC('そのとき、誰と一緒でしたか？'),
        'ここで少し休憩しましょう。風が心地よいですね。',
        Q('最近買ってよかったものはありますか？'),
        Q('最近驚いたことはありますか？')
      ],
      outro: ['ウォーミングアップが完了しました。', '時間を少し進めます。', GO('sunset'), '夕方になりました。', 'ここからは、少し前の世の中の出来事を思い出してみましょう。']
    },
    { // 夕焼け: news and trends from a year or two ago, just on the edge of forgetting
      lines: [
        Q('去年の流行語大賞を覚えていますか？'),
        Q('去年の今ごろ、話題になっていたニュースは何でしたか？'),
        '正解を確認する必要はありません。思い出そうとすること自体がトレーニングです。',
        Q('去年いちばん流行していた曲を、口ずさめますか？'),
        Q('去年の大河ドラマのタイトルを思い出せますか？'),
        'ありましたね、そういうもの。',
        Q('一昨年の流行語大賞は思い出せますか？')
      ],
      outro: ['夕焼け、きれいでしたね。', 'これから空が暗くなっていきます。', GO('night'), '星がよく見えますね。', 'ここからは、あなたの年齢を半分にして考えてみましょう。', '現在30歳の場合、15歳ごろが対象です。', 'その年齢のころのことを、思い出してみてください。']
    },
    { // 夜: half your age
      lines: [
        Q('年齢が半分のころ、どこに住んでいましたか？'),
        QC('そのころの部屋のカーテンは、何色でしたか？'),
        'ぼんやりした記憶でも大丈夫です。',
        QC('そのころ、いちばん仲がよかったのは誰ですか？'),
        QC('その年齢のころ、夢中になっていたものは何ですか？'),
        '順調です。脳がほぐれてきたようですね。',
        QC('そのころ、いちばんよく通ったお店はどこですか？')
      ],
      outro: ['夜のトレーニングでは、たくさん思い出せましたね。', '時間を進めて、朝を迎えましょう。', GO('dawn'), '夜明けです。', '最後は、年齢を4分の1にして考えてみましょう。', '現在30歳の場合、7歳ごろが対象です。', '幼いころの記憶を、たどってみましょう。']
    },
    { // 夜明け: a quarter of your age
      lines: [
        Q('年齢が4分の1のころ、どこでよく遊んでいましたか？'),
        QC('そのころ、好きだった食べ物は何ですか？'),
        '肩の力を抜いて、深呼吸をしてみましょう。',
        QC('そのころ、お気に入りのおもちゃは何でしたか？'),

      let c; do { c = Math.floor(Math.random() * CHORDS.length) } while (c === chord)

      voices.forEach((o, i) => o.frequency.setValueAtTime(CHORDS[chord][i], ctx.currentTime))

    const NOTES = [587.33, 659.25, 739.99, 880.0, 987.77, 1174.66]
    function glass() {
      const t = ctx.currentTime
      const f = NOTES[Math.floor(Math.random() * NOTES.length)]
      for (const [m, v] of [[1, 0.014], [2.01, 0.003]]) {
        const o = ctx.createOscillator(), g = ctx.createGain()
        o.type = 'sine'; o.frequency.value = f * m
        g.gain.setValueAtTime(0, t)
        g.gain.linearRampToValueAtTime(v, t + 0.04)
        g.gain.exponentialRampToValueAtTime(0.0001, t + 5)
        o.connect(g).connect(tone)
        o.start(t); o.stop(t + 5.2)

  // ---- remembering where the campaign got to ----

    q.setAttribute('aria-pressed', String(hq))
    q.disabled = !!busy
    q.innerHTML = '<div>高画質<small>本物の波のシミュレーション</small></div><span>' + (busy ? '切替中…' : hq ? 'オン' : 'オフ') + '</span>'
  }
  // switch in place (no page reload), keeping the time of day and where you face
  async function switchQuality() {
    const state = api.getState()
    hq = !hq
    try { localStorage.setItem('sora-hq', hq ? 'on' : 'off') } catch (_) {}
    labelQuality(true)
    api.dispose()
    try {
      await boot(state)
    } catch (err) {
      console.error(err)
      hq = !hq
      try { localStorage.setItem('sora-hq', hq ? 'on' : 'off') } catch (_) {}
      await boot(state)
    }
    labelQuality()
    close(); q.blur(); btn.blur()
  }
  function mark(id) { opts.forEach(o => o.b.setAttribute('aria-current', String(o.p.id === id))) }
  function nearest() {
    const h = api.getHours()
    let best = null, bd = 99
    for (const o of opts) { const d = Math.min(Math.abs(o.p.hours - h), 24 - Math.abs(o.p.hours - h)); if (d < bd) { bd = d; best = o.p.id } }
    return bd < 0.3 ? best : null
  }
  function open() { closeMusic(); mark(nearest()); panel.hidden = false; btn.setAttribute('aria-expanded', 'true') }
  function close() { panel.hidden = true; btn.setAttribute('aria-expanded', 'false') }

  try {
    if (hq) msg.innerHTML = '空と波を計算しています…'
    ;({ start } = await import('./sora.js'))
    // pick up a campaign left unfinished last time
    if (progress) {
      Object.assign(talk, { introDone: progress.introDone, i: progress.i, chapter: progress.chapter })
      if (progress.introDone || progress.i > 0) talk.queue.push('おかえりなさい。前回の続きから再開します。')
    }
    await boot(progress ? { hoursTotal: progress.hours, yaw: progress.yaw ?? 0, y: 40 } : null)
    buildMenu()
    btn.addEventListener('click', () => (panel.hidden ? open() : close()))
    document.addEventListener('pointerdown', e => { if (!menu.contains(e.target)) close() })
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close() })
    menu.hidden = false
    requestAnimationFrame(followFairy)
    await askSound()
    if (saved.done) setTimeout(grantCampaignSongs, 2500)
    later(speakLoop, 4000)
  } catch (err) {
    console.error(err)
    msg.innerHTML = 'この端末では空を描けませんでした<small>新しめのブラウザ（Safari 26 / Chrome）で開いてみてください</small>'
  }
</script>
